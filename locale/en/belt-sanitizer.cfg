[mod-name]
belt-sanitizer=Belt Sanitizer

[mod-description]
belt-sanitizer=Outputs extra information when used in conjunction with the B.E.L.T. CLI tool.

[mod-setting-name]
belt-sanitizer-report-pollution=Report pollution
belt-sanitizer-report-biters=Report biters
belt-sanitizer-peaceful-mode=Peaceful mode
belt-sanitizer-report-expansion=Report enemy expansion
belt-sanitizer-report-active-cars=Report active cars
belt-sanitizer-write-diagnostics=Write diagnostics
belt-sanitizer-production-items=Production items
belt-sanitizer-production-fluids=Production fluids
belt-sanitizer-blueprint-mode=Blueprint mode
belt-sanitizer-blueprint-string=Blueprint string
belt-sanitizer-blueprint-save-name=Blueprint save name
belt-sanitizer-blueprint-count=Blueprint count
belt-sanitizer-blueprint-bot-count=Blueprint bot count
belt-sanitizer-mining-module-replacement=Mining module replacement
belt-sanitizer-mining-module-replacement-quality=Mining module replacement quality
belt-sanitizer-target-tick=Target tick

[mod-setting-description]
belt-sanitizer-report-pollution=Include pollution statistics in the generated report.
belt-sanitizer-report-biters=Include enemy unit and spawner counts in the generated report.
belt-sanitizer-peaceful-mode=Enable peaceful mode for the scenario run.
belt-sanitizer-report-expansion=Include enemy expansion status in the generated report.
belt-sanitizer-report-active-cars=Include active car counts in the generated report.
belt-sanitizer-write-diagnostics=Write diagnostic output alongside the generated report.
belt-sanitizer-production-items=Comma-separated item prototype names to include in production statistics.
belt-sanitizer-production-fluids=Comma-separated fluid prototype names to include in production statistics.
belt-sanitizer-blueprint-mode=Run in blueprint mode instead of snapshot mode.
belt-sanitizer-blueprint-string=Blueprint string to import and place during blueprint mode.
belt-sanitizer-blueprint-save-name=Save name to use after blueprint mode finishes.
belt-sanitizer-blueprint-count=Number of blueprint copies to place.
belt-sanitizer-blueprint-bot-count=Number of construction robots to provide for blueprint mode.
belt-sanitizer-mining-module-replacement=Module item prototype to use when replacing mining drill modules.
belt-sanitizer-mining-module-replacement-quality=Quality name to use for replacement mining modules.
belt-sanitizer-target-tick=Number of ticks to run before taking the snapshot or saving blueprint mode.
